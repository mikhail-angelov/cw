name: macOS build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm install -g npm@11
      - name: Check release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('tinyjs.json', 'utf8'));
          if (process.env.GITHUB_REF_TYPE === 'tag' && process.env.GITHUB_REF_NAME !== `v${version}`) {
            throw new Error(`Expected tag v${version}`);
          }
          JS
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node --check src/frontend/app.js
      - name: Install pinned tinyjs
        env:
          TINYJS_VERSION: '0.67.0'
        run: |
          base="https://github.com/tarwin/tinyjsapp/releases/download/v${TINYJS_VERSION}"
          archive="tinyjs-macos-$(uname -m).tar.gz"
          cd "$RUNNER_TEMP"
          curl -fLsS "$base/$archive" -o "$archive"
          curl -fLsS "$base/checksums.txt" -o checksums.txt
          grep " $archive$" checksums.txt | shasum -a 256 -c -
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/tinyjs" >> "$GITHUB_PATH"
      - run: npm run build -- --universal
      - run: npm run package:mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cw-wallet-macos-universal
          path: release/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cw-wallet-macos-universal
          path: release
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "CW Wallet $GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" release/*.zip release/*.sha256
      - name: Update Homebrew Cask
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [[ -z "$HOMEBREW_TAP_TOKEN" ]]; then
            echo 'HOMEBREW_TAP_TOKEN is not configured; skipping tap update.'
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mikhail-angelov/homebrew-tap.git" tap
          node scripts/cask.mjs "$version" release > tap/Casks/cw-wallet.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cw-wallet.rb
          if ! git diff --cached --quiet; then
            git commit -m "cw-wallet $version"
            git push
          fi
